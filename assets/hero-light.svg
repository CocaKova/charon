ports to one <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1f2328">.charon</tspan> file (Argon2id + AES-GCM) · no cloud account</text></svg>