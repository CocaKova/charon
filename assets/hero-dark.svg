<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Charon: phone keyboard, the terminal-core emulator, an SSH session, and your hosts"><rect width="1200" height="330" rx="16" fill="#0d1117" stroke="#30363d"/><circle cx="74" cy="66" r="11" fill="#d9a441"/><circle cx="74" cy="66" r="4.5" fill="#0d1117"/><path d="M58,84 q4,-4 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#3ecfb2" stroke-width="2" stroke-linecap="round" opacity="1.0"/><path d="M58,91 q4,-4 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#3ecfb2" stroke-width="2" stroke-linecap="round" opacity="0.7"/><path d="M58,98 q4,-4 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#3ecfb2" stroke-width="2" stroke-linecap="round" opacity="0.45"/><text x="108" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#e6edf3">charon</text><text x="60" y="128" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">An Android SSH client with a terminal emulator written from scratch. Nothing functional is paywalled.</text><rect x="60" y="170" width="240" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="180.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">keyboard + key row</text><text x="180.0" y="222" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">IME words · sticky Ctrl/Alt · F-keys</text><rect x="340" y="170" width="240" height="70" rx="10" fill="#161b22" stroke="#3ecfb2" stroke-width="1.5"/><text x="460.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">terminal-core</text><text x="460.0" y="222" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">VT/xterm · truecolor · inline images</text><rect x="620" y="170" width="240" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="740.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">SSH session</text><text x="740.0" y="222" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">shell · SFTP · port forwards</text><rect x="900" y="170" width="240" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="1020.0" y="200" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">your hosts</text><text x="1020.0" y="222" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">tmux · tailnet · LAN</text><line x1="307" y1="205.0" x2="333" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M332,200.0 L340,205.0 L332,210.0 Z" fill="#8b949e"/><path d="M308,200.0 L300,205.0 L308,210.0 Z" fill="#8b949e"/><line x1="587" y1="205.0" x2="613" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M612,200.0 L620,205.0 L612,210.0 Z" fill="#8b949e"/><path d="M588,200.0 L580,205.0 L588,210.0 Z" fill="#8b949e"/><line x1="867" y1="205.0" x2="893" y2="205.0" stroke="#8b949e" stroke-width="1.8"/><path d="M892,200.0 L900,205.0 L892,210.0 Z" fill="#8b949e"/><path d="M868,200.0 L860,205.0 L868,210.0 Z" fill="#8b949e"/><text x="60" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Keys and passwords sealed by the Android Keystore · whole vault exports to one <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#e6edf3">.charon</tspan> file (Argon2id + AES-GCM) · no cloud account</text></svg>